<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アンケートゲーム 会場スクリーン</title>
<style>
  :root{
    --bg1:#141a33; --bg2:#0b0f22; --ink:#fff; --sub:#aab3d6; --accent:#ffb347;
    --cA:#ff6b6b; --cB:#4ecdc4; --cC:#ffd93d; --cD:#a78bfa; --cE:#6be675; --cF:#ff9de2;
    --maj:#ffb347; --min:#c084fc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Segoe UI",sans-serif;
    color:var(--ink);background:radial-gradient(ellipse at 50% 0%,var(--bg1),var(--bg2) 70%);
    display:flex;flex-direction:column;
  }
  .top{display:flex;align-items:center;justify-content:space-between;padding:2vh 4vw 0;font-weight:800;font-size:2.4vh;color:var(--sub)}
  .top .brand{color:var(--accent);letter-spacing:.06em}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2vh 5vw 4vh;gap:3vh;text-align:center}
  .hidden{display:none!important}

  .h1{font-size:9vh;font-weight:900;line-height:1.2;letter-spacing:.02em}
  .h2{font-size:5.5vh;font-weight:900;line-height:1.3}
  .sub{font-size:3.2vh;color:var(--sub);font-weight:700;line-height:1.6}
  .tag{display:inline-block;background:var(--accent);color:#1b1230;border-radius:999px;padding:.6vh 3vh;font-size:3.4vh;font-weight:900}
  .tag.practice{background:var(--cB)}
  .qtext{font-size:7vh;font-weight:900;line-height:1.35;max-width:90vw;text-wrap:balance}
  .qtext.small{font-size:5.2vh}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:2vh 3vw;width:min(90vw,150vh)}
  .opt{display:flex;align-items:center;gap:2vw;background:rgba(255,255,255,.07);border:.4vh solid rgba(255,255,255,.12);border-radius:3vh;padding:2.4vh 3vw;font-size:4.6vh;font-weight:900;text-align:left}
  .opt .lbl{flex:0 0 7vh;height:7vh;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#1b1230;font-size:4vh}
  .cA{background:var(--cA)} .cB{background:var(--cB)} .cC{background:var(--cC)} .cD{background:var(--cD)} .cE{background:var(--cE)} .cF{background:var(--cF)}

  .counter{font-size:5vh;font-weight:900;color:var(--sub)}
  .counter b{color:#fff;font-size:1.4em}
  .pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* QR */
  .qrwrap{display:flex;align-items:center;gap:5vw}
  .qr{background:#fff;padding:2vh;border-radius:2vh}
  .qr img,.qr canvas{display:block;width:38vh;height:38vh}
  .url{font-size:3.6vh;font-weight:800;word-break:break-all;color:#fff}

  /* グラフ */
  .chart{display:flex;align-items:flex-end;justify-content:center;gap:4vw;height:52vh;width:min(92vw,170vh);padding:0 2vw}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:1.2vh;min-width:0}
  .col .pct{font-size:5.5vh;font-weight:900;line-height:1;min-height:6vh}
  .col .barw{width:100%;flex:1;display:flex;align-items:flex-end;border-bottom:.5vh solid rgba(255,255,255,.25)}
  .col .bar{width:100%;height:0;border-radius:2vh 2vh 0 0;box-shadow:0 0 4vh rgba(255,255,255,.12);transition:height 3.6s cubic-bezier(.22,.9,.3,1)}
  .col .name{font-size:3.4vh;font-weight:900;line-height:1.3;height:9vh;display:flex;align-items:flex-start;justify-content:center;text-align:center}
  .col .name .lbl{display:inline-flex;align-items:center;justify-content:center;width:4.6vh;height:4.6vh;border-radius:50%;color:#1b1230;font-size:2.8vh;margin-right:1vw;flex:0 0 auto}
  .col .badge{display:inline-block;font-size:3vh;font-weight:900;border-radius:999px;padding:0 2vh;height:5vh;line-height:5vh;opacity:0;transform:translateY(1vh);transition:opacity .5s,transform .5s}
  .col .badge.maj{background:var(--maj);color:#1b1230}
  .col .badge.min{background:var(--min);color:#1b1230}
  .chart.done .badge.show{opacity:1;transform:none}
  .chart.done .col.dim .bar{filter:brightness(.55)}
  .verdict{display:flex;gap:4vw;font-size:4.8vh;font-weight:900;opacity:0;transition:opacity .6s}
  .verdict.show{opacity:1}
  .verdict .maj{color:var(--maj)} .verdict .min{color:var(--min)}

  /* 最終ランキング */
  .rank{display:flex;flex-direction:column;gap:2.5vh;width:min(90vw,140vh)}
  .rk{display:flex;align-items:center;gap:3vw;background:rgba(255,255,255,.07);border-radius:3vh;padding:2.5vh 4vw;opacity:0;transform:translateY(3vh) scale(.96);transition:opacity .7s,transform .7s}
  .rk.show{opacity:1;transform:none}
  .rk .pos{font-size:7vh;font-weight:900;flex:0 0 18vh;text-align:center}
  .rk.r1{background:linear-gradient(90deg,rgba(255,179,71,.35),rgba(255,255,255,.07));border:.5vh solid var(--accent)}
  .rk.r1 .pos{color:var(--accent);font-size:9vh}
  .rk.r2 .pos{color:#dfe6f5} .rk.r3 .pos{color:#e0a370}
  .rk .names{flex:1;text-align:left;font-size:5.5vh;font-weight:900;line-height:1.3}
  .rk.r1 .names{font-size:7vh}
  .rk .names small{display:block;font-size:2.8vh;color:var(--sub);font-weight:700}
  .rk .pts{font-size:6vh;font-weight:900;white-space:nowrap}
  .rk .pts small{font-size:.5em}
  .rk.ph{opacity:.35;transform:none}
  .rk.ph .names{color:var(--sub);font-size:4vh}
  .fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .fx i{position:absolute;top:-4vh;width:1.6vh;height:1.6vh;border-radius:.3vh;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  .top,.stage{position:relative;z-index:1}
  /* 右下に常に出す小さいQR（大きいQRが出ていない画面だけ） */
  .miniqr{position:fixed;right:2vh;bottom:2vh;z-index:2;display:flex;flex-direction:column;align-items:center;gap:.6vh;background:#fff;color:#1b1230;padding:1.4vh;border-radius:1.6vh;box-shadow:0 1vh 3vh rgba(0,0,0,.35)}
  #qrMini{width:17vh;height:17vh}
  #qrMini img,#qrMini canvas{display:block;width:17vh;height:17vh}
  .miniqr p{font-size:1.9vh;font-weight:900}
  body.withqr .stage{padding-right:24vh}
  .offline{position:fixed;top:1vh;left:50%;transform:translateX(-50%);background:#e8604c;color:#fff;font-weight:800;padding:.6vh 2vh;border-radius:999px;font-size:2.2vh}
</style>
</head>
<body>
<div class="top"><span class="brand">アンケートゲーム</span><span id="topR"></span></div>
<div id="stage" class="stage"></div>
<div id="fx" class="fx"></div>
<div id="off" class="offline hidden">接続が切れました… 再接続中</div>
<div id="miniQr" class="miniqr hidden"><div id="qrMini"></div><p>途中参加OK</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/questions.js"></script>
<script src="js/store.js"></script>
<script src="js/deco.js"></script>
<script>
(function(){
  const { esc, LABELS } = Store;
  const $stage = document.getElementById('stage');
  const $topR = document.getElementById('topR');
  const COLORS = ['cA','cB','cC','cD','cE','cF'];
  const NOANIM = new URLSearchParams(location.search).has('noanim'); // 動作確認用: アニメーションなしで最終状態を表示
  let lastKey = null;
  let pub = null;

  const joinUrl = new URL('./', location.href).href;   // このページと同じフォルダの index.html
  Deco.place('screen');
  // 小さいQRは最初に1回だけ描いておき、画面に応じて出し入れする
  if (typeof QRCode !== 'undefined') new QRCode(document.getElementById('qrMini'), { text: joinUrl, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
  (async () => {
    try { Store.init(); await Store.signIn(); }
    catch (e) { $stage.innerHTML = `<p class="h2">設定エラー</p><p class="sub">${esc(e.message)}</p>`; return; }
    Store.subscribe('screen', v => { pub = v.public; render(); }, err => document.getElementById('off').classList.toggle('hidden', !err));
  })();

  function qLabel(){ return pub.stage === 'practice' ? '練習問題' : `第${pub.qIndex + 1}問`; }

  function render(){
    let screen;
    if (pub.phase === 'final') screen = 'final';
    else if (pub.stage === 'practice' && pub.phase === 'idle') screen = 'lobby';
    else if (pub.stage === 'main' && pub.qIndex < 0) screen = 'entry';
    else screen = pub.phase; // idle | open | closed | result

    // 常に更新する軽い部分
    if (screen === 'open') { const c = document.getElementById('cnt'); if (c) c.innerHTML = `<b>${pub.counts.answered}</b> / ${pub.counts.eligible}人`; }
    if (screen === 'lobby') { const c = document.getElementById('cnt'); if (c) c.innerHTML = `参加者 <b>${pub.counts.players}</b>人`; }
    if (screen === 'entry') { const c = document.getElementById('cnt'); if (c) c.innerHTML = `本番参加 <b>${pub.counts.entered}</b>人`; }
    const showMini = !['lobby', 'entry'].includes(screen);   // 大きいQRがない画面では右下に常に出す
    document.getElementById('miniQr').classList.toggle('hidden', !showMini);
    document.body.classList.toggle('withqr', showMini);
    $topR.textContent = pub.stage === 'main' && pub.qIndex >= 0 && pub.phase !== 'final' ? `${pub.qIndex + 1} / ${pub.totalQuestions}` : '';

    const key = [screen, pub.stage, pub.qIndex, screen === 'final' ? pub.finalReveal : ''].join('|');
    if (key === lastKey) return;
    lastKey = key;
    R[screen]();
    render(); // 動的部分の初期値を入れる
  }

  const R = {};

  function qrBlock(){
    return `<div class="qrwrap"><div class="qr" id="qr"></div><div style="text-align:left"><p class="sub" style="margin-bottom:1vh">QRコードを読み取って参加</p><p class="url">${esc(joinUrl)}</p><p id="cnt" class="counter" style="margin-top:3vh"></p></div></div>`;
  }
  function drawQr(){
    const el = document.getElementById('qr');
    if (!el || typeof QRCode === 'undefined') { if (el) el.innerHTML = '<p style="color:#333;padding:2vh">QR生成不可（オフライン）</p>'; return; }
    new QRCode(el, { text: joinUrl, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
  }

  R.lobby = () => {
    $stage.innerHTML = `<h1 class="h1">アンケートゲーム</h1><p class="sub">まずは練習問題から。得点は入りません。</p>${qrBlock()}`;
    drawQr();
  };

  R.entry = () => {
    $stage.innerHTML = `
      <h1 class="h2">本番に参加する人は<br>スマホの「本番に参加する」を押してください</h1>
      <div class="opts" style="width:min(90vw,150vh);grid-template-columns:1fr 1fr">
        <div class="opt" style="font-size:4vh;justify-content:center"><span class="lbl cD">💎</span>自分が少数派 → 1点</div>
        <div class="opt" style="font-size:4vh;justify-content:center"><span class="lbl cC">🎯</span>多数派を当てる → 1点</div>
      </div>
      <p class="sub">全 ${pub.totalQuestions} 問の総合得点で、上位3名を発表します</p>
      ${qrBlock()}`;
    drawQr();
  };

  function questionBlock(){
    const q = pub.question;
    return `
      <p><span class="tag ${pub.stage==='practice'?'practice':''}">${qLabel()}</span></p>
      <h1 class="qtext ${q.text.length > 18 ? 'small' : ''}">${esc(q.text)}</h1>
      <div class="opts">${q.options.map((o,i)=>`<div class="opt"><span class="lbl ${COLORS[i]}">${LABELS[i]}</span><span>${esc(o)}</span></div>`).join('')}</div>`;
  }

  R.idle = () => {
    $stage.innerHTML = questionBlock() + `<p class="sub">まもなく回答受付を始めます</p>`;
  };
  R.open = () => {
    $stage.innerHTML = questionBlock() + `<p class="counter">回答受付中 <span class="pulse">●</span>　回答済み <span id="cnt"></span></p>`;
  };
  R.closed = () => {
    $stage.innerHTML = `
      <p><span class="tag ${pub.stage==='practice'?'practice':''}">${qLabel()}</span></p>
      <h1 class="qtext small">${esc(pub.question.text)}</h1>
      <p class="h1" style="margin-top:4vh">集計中<span class="pulse">…</span></p>
      <p class="sub">多数派はどれ？　レア人材はどこに？</p>`;
  };

  R.result = () => {
    const q = pub.question, r = pub.result;
    const max = Math.max(1, ...r.counts);
    const cols = q.options.map((o,i) => {
      const isMaj = r.majority.includes(i), isMin = r.minority.includes(i);
      const badge = isMaj ? '<span class="badge maj">👑 多数派</span>' : isMin ? '<span class="badge min">💎 少数派</span>' : '<span class="badge"></span>';
      return `<div class="col ${(isMaj||isMin)?'':'dim'}">
        <div class="pct" data-n="${r.counts[i]}">0%</div>
        <div class="barw"><div class="bar ${COLORS[i]}" data-h="${r.counts[i]/max*100}"></div></div>
        <div class="name"><span class="lbl ${COLORS[i]}">${LABELS[i]}</span><span>${esc(o)}</span></div>
        ${badge}
      </div>`;
    }).join('');
    const majText = r.majority.map(i => LABELS[i] + '. ' + q.options[i]).join('、') || 'なし';
    const minText = r.minority.map(i => LABELS[i] + '. ' + q.options[i]).join('、') || 'なし';
    $stage.innerHTML = `
      <p><span class="tag ${pub.stage==='practice'?'practice':''}">${qLabel()} 結果</span>　<span class="sub">${esc(q.text)}　（回答 ${r.total}人）</span></p>
      <div class="chart" id="chart">${cols}</div>
      <div class="verdict" id="verdict"><span class="maj">多数派：${esc(majText)}</span><span class="min">少数派：${esc(minText)}</span></div>`;

    // アニメーション：棒が下から伸びる → パーセント数字がカウントアップ → 判定表示
    const DUR = 3600, STAGGER = 250;
    const chart = document.getElementById('chart');
    const bars = [...chart.querySelectorAll('.bar')];
    const pcts = [...chart.querySelectorAll('.pct')];
    if (NOANIM) {
      bars.forEach(b => { b.style.transition = 'none'; b.style.height = b.dataset.h + '%'; });
      pcts.forEach(p => p.textContent = (r.total ? Math.round(Number(p.dataset.n)/r.total*100) : 0) + '%');
      chart.classList.add('done');
      chart.querySelectorAll('.badge.maj,.badge.min').forEach(b => b.classList.add('show'));
      document.getElementById('verdict').classList.add('show');
      return;
    }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bars.forEach((b,i) => { b.style.transitionDelay = (i*STAGGER)+'ms'; b.style.height = b.dataset.h + '%'; });
      const t0 = performance.now();
      (function tick(now){
        const el = now - t0;
        pcts.forEach((p,i) => {
          const k = Math.min(1, Math.max(0, (el - i*STAGGER) / DUR));
          const e = 1 - Math.pow(1 - k, 3);
          const target = r.total ? Number(p.dataset.n) / r.total * 100 : 0;
          p.textContent = Math.round(target * e) + '%';
        });
        if (el < DUR + STAGGER * bars.length) requestAnimationFrame(tick);
        else {
          pcts.forEach(p => p.textContent = (r.total ? Math.round(Number(p.dataset.n)/r.total*100) : 0) + '%');
          chart.classList.add('done');
          setTimeout(() => { chart.querySelectorAll('.badge.maj,.badge.min').forEach(b => b.classList.add('show')); document.getElementById('verdict').classList.add('show'); }, 500);
        }
      })(t0);
    }));
  };

  R.final = () => {
    const groups = pub.ranking || [];          // rank 昇順
    const revealed = pub.finalReveal;           // 下位から何グループ開いたか
    const rows = groups.map((g, gi) => {
      const showIdx = groups.length - 1 - gi;   // 下から数えた順
      const show = showIdx < revealed;
      const fresh = showIdx === revealed - 1;   // 今回新しく開いた行だけアニメーション
      const names = g.players.map(p => esc(p.name)).join('　');
      return `<div class="rk r${g.rank} ${show ? (fresh ? 'fresh' : 'show') : 'ph'}" data-rank="${g.rank}">
        <div class="pos">${g.rank}位</div>
        <div class="names">${show ? names : '？？？'}${show && g.players.length > 1 ? `<small>${g.players.length}名 同点</small>` : ''}</div>
        <div class="pts">${show ? g.total + '<small>点</small>' : ''}</div>
      </div>`;
    }).join('');
    $stage.innerHTML = `
      <h1 class="h2">アンケートゲーム 最終結果</h1>
      <div class="rank">${rows || '<p class="sub">本番参加者がいません</p>'}</div>
      ${revealed >= groups.length && groups.length ? '<p class="h2" style="color:var(--accent)">優勝おめでとうございます！🎉</p>' : '<p class="sub">下位から順に発表します</p>'}`;
    if (NOANIM) $stage.querySelectorAll('.rk').forEach(el => el.style.transition = 'none');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      $stage.querySelectorAll('.rk.fresh').forEach(el => el.classList.add('show'));
    }));
    if (NOANIM) $stage.querySelectorAll('.rk.fresh').forEach(el => el.classList.add('show'));
    if (revealed >= groups.length && groups.length) confetti();
  };

  function confetti(){
    const fx = document.getElementById('fx');
    fx.innerHTML = '';
    const cols = ['#ff6b6b','#4ecdc4','#ffd93d','#a78bfa','#ffb347','#fff'];
    for (let i = 0; i < 120; i++) {
      const s = document.createElement('i');
      s.style.left = Math.random()*100 + 'vw';
      s.style.background = cols[i % cols.length];
      s.style.animationDuration = (3 + Math.random()*3) + 's';
      s.style.animationDelay = (Math.random()*2) + 's';
      fx.appendChild(s);
    }
    setTimeout(() => fx.innerHTML = '', 9000);
  }
})();
</script>
</body>
</html>
